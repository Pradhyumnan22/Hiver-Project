<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiver Desk</title>
  <style>
    :root { --ink: #142033; --muted: #5d6b7c; --line: #e3e8ef; --bg: #eef2f6; --accent: #0f6e56; }
    * { box-sizing: border-box; }
    body { margin: 0; height: 100vh; display: flex; flex-direction: column; font-family: "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
    header { padding: 16px 24px; background: var(--ink); color: white; }
    header p { margin: 4px 0 0; color: #c9d3e0; font-size: 13px; }
    #thread { flex: 1; overflow: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
    .row { display: flex; }
    .row.user { justify-content: flex-end; }
    .bubble { max-width: min(680px, 85%); padding: 14px 16px; border-radius: 18px; background: white; border: 1px solid var(--line); }
    .row.user .bubble { background: var(--ink); color: white; }
    .note { margin-top: 8px; color: var(--muted); font-size: 12px; }
    form { display: flex; gap: 8px; padding: 16px; background: white; border-top: 1px solid var(--line); }
    input { flex: 1; border: 1px solid var(--line); border-radius: 999px; padding: 14px 16px; font: 16px "Segoe UI", sans-serif; }
    button { border: 0; border-radius: 999px; background: var(--accent); color: white; padding: 0 18px; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .6; }
  </style>
</head>
<body>
  <header>
    <strong>Hiver Desk</strong>
    <p>AmazonHelp offline draft chat. Nothing here is sent to a customer.</p>
  </header>
  <main id="thread">
    <div class="row">
      <div class="bubble">Tell me what happened with your order, account, or delivery. I can draft a reply or explain why a person needs to take it.</div>
    </div>
  </main>
  <form id="chat-form">
    <input id="message" placeholder="Type a customer message" required>
    <button type="submit">Send</button>
  </form>
  <script src="config.js"></script>
  <script>
    const thread = document.querySelector("#thread");
    const input = document.querySelector("#message");
    const history = [];
    function addBubble(text, role, note) {
      const row = document.createElement("div");
      row.className = "row " + role;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      if (note) {
        const detail = document.createElement("div");
        detail.className = "note";
        detail.textContent = note;
        bubble.appendChild(detail);
      }
      row.appendChild(bubble);
      thread.appendChild(row);
      thread.scrollTop = thread.scrollHeight;
    }
    document.querySelector("#chat-form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      const button = event.target.querySelector("button");
      addBubble(message, "user");
      input.value = "";
      button.disabled = true;
      const apiBase = window.HIVER_API_BASE || "";
      const response = await fetch(`${apiBase}/api/draft`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, history })
      });
      const data = await response.json();
      const reply = data.reply || "I need a person to handle this. " + (data.reason_detail || "");
      const note = data.action === "escalate"
        ? "A specialist should confirm this · " + (data.intent || "unknown")
        : "Draft ready · " + (data.intent || "unknown");
      addBubble(reply, "agent", note);
      history.push(message, reply);
      button.disabled = false;
      input.focus();
    });
  </script>
</body>
</html>
